<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Wave</title>
    <link rel="shortcut icon" href="./assets/hero-circle.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <!-- Navigation Bar -->
        <nav class="navigation_bar">
            <div class="nav">
                <img src="./assets/TechWave.svg" alt="">
                <ul class="navigation_bar_menu">
                    <a target="_blank" href="#">About</a>
                    <a target="_blank" href="#">Episodes</a>
                    <a target="_blank" href="#">Host</a>
                </ul>
                <div class="navigation_button">
                    <a target="_blank" href="#">Subscribe</a>
                    <img src="./assets/ArrowRight.svg" alt="">
                </div>
                <img class="hamburger_menu" src="./assets/hamburger-menu.png" alt="">
            </div>
        </nav>
        <!-- Hero Section -->
        <section class="hero_section">
            <div class="hero_circle_div">
                <img class="hero_circle" src="./assets/hero-circle.png" alt="">
                <img class="mic" src="./assets/microphone.png" alt="">
                <p class="hero_circle_text">NEW</p>
            </div>
            <div class="hero_section_content">
                <div class="hero_section_content_text">
                    <h1>TechWave</h1>
                    <p>Your daily dose of tech insights, productivity hacks, and personal growth</p>
                </div>
                <div class="hero_section_buttons">
                    <div class="hero_main_button">
                        <img src="./assets/spotify.png" alt="">
                        <a target="_blank" href="#">Listen on Spotify</a>
                    </div>
                    <div class="hero_secondary_button">
                        <img src="./assets/message.png" alt="">
                        <a target="_blank" href="#">Subscribe</a>
                    </div>
                </div>
            </div>
        </section>
    </header>
</body>
</html>
